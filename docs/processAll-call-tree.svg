<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="935" viewBox="0 0 1520 935">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowEdt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .bg      { fill: #ffffff; }
      .title   { font: 600 18px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .sub     { font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
      .head    { font: 600 13px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .headBg  { font: 600 13px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #047857; }
      .headEdt { font: 600 13px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #b45309; }
      .note    { font: 12px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
      .noteEdt { font: 600 11px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #b45309; }
      .noteBg  { font: 600 11px -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #047857; }
      .code    { font: 13px Menlo, Monaco, "Courier New", monospace; fill: #0f172a; }
      .codeW   { font: 600 13px Menlo, Monaco, "Courier New", monospace; fill: #ffffff; }
      .ref     { font: 11px Menlo, Monaco, "Courier New", monospace; fill: #64748b; }
      .refW    { font: 11px Menlo, Monaco, "Courier New", monospace; fill: #dbeafe; }
      .box     { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .dim     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .main    { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
      .bgT     { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.2; }
      .util    { fill: #d1fae5; stroke: #10b981; stroke-width: 1.6; }
      .errT    { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.2; }
      .edt     { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.3; }
      .edge    { fill: none; stroke: #64748b; stroke-width: 1.4; }
      .postEdt { fill: none; stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .postBg  { fill: none; stroke: #059669; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .lane    { fill: #f0fdf4; stroke: #34d399; stroke-width: 1.4; stroke-dasharray: 8 4; }
      .laneEdt { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.4; stroke-dasharray: 8 4; }
      .loop    { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect class="bg" width="1520" height="935"/>
  <text class="title" x="30" y="34">processAll() call tree — LivePhotoWindow.java</text>
  <text class="sub"   x="30" y="56">File I/O runs on the live-photo-search thread; only UI updates are posted back to the Swing EDT.</text>

  <!-- ============ CALLERS ============ -->
  <text class="head" x="30" y="92">① Dropped on the app icon</text>

  <rect class="box" x="30" y="102" width="250" height="44" rx="6"/>
  <text class="code" x="42" y="120">launch()</text>
  <text class="ref"  x="42" y="136">LivePhotoWindow:79</text>

  <rect class="box" x="30" y="172" width="250" height="44" rx="6"/>
  <text class="code" x="42" y="190">setOpenFileHandler(…)</text>
  <text class="ref"  x="42" y="206">:86  AppKit thread</text>
  <path class="edge" d="M155,146 L155,170" marker-end="url(#arrow)"/>

  <text class="head" x="30" y="392">② Dropped on the window</text>

  <rect class="box" x="30" y="400" width="250" height="44" rx="6"/>
  <text class="code" x="42" y="418">importData(support)</text>
  <text class="ref"  x="42" y="434">:172  Swing EDT</text>

  <rect class="dim" x="70" y="470" width="210" height="44" rx="6"/>
  <text class="code" x="82" y="488">canImport(support)</text>
  <text class="ref"  x="82" y="504">:167</text>

  <rect class="dim" x="70" y="530" width="210" height="44" rx="6"/>
  <text class="code" x="82" y="548">getTransferData(…)</text>
  <text class="ref"  x="82" y="564">:179</text>

  <path class="edge" d="M45,444 L45,552 L68,552" marker-end="url(#arrow)"/>
  <path class="edge" d="M45,492 L68,492" marker-end="url(#arrow)"/>

  <!-- callers → processAll (direct calls now; no invokeLater) -->
  <path class="edge" d="M280,194 C300,194 300,292 318,292" marker-end="url(#arrow)"/>
  <path class="edge" d="M280,422 C300,422 300,308 318,308" marker-end="url(#arrow)"/>

  <!-- ============ processAll ============ -->
  <rect class="main" x="320" y="278" width="220" height="44" rx="6"/>
  <text class="codeW" x="332" y="296">processAll(List&lt;File&gt;)</text>
  <text class="refW"  x="332" y="312">:97  caller's thread</text>

  <!-- processAll's direct calls -->
  <path class="edge" d="M540,300 L565,300"/>
  <path class="edge" d="M565,132 L565,442"/>
  <path class="edge" d="M565,132 L588,132" marker-end="url(#arrow)"/>
  <path class="edge" d="M565,202 L588,202" marker-end="url(#arrow)"/>
  <path class="edge" d="M565,442 L588,442" marker-end="url(#arrow)"/>
  <text class="note" x="552" y="126" text-anchor="end">1</text>
  <text class="note" x="552" y="196" text-anchor="end">2</text>
  <text class="note" x="552" y="436" text-anchor="end">3</text>

  <rect class="box" x="590" y="110" width="270" height="44" rx="6"/>
  <text class="code" x="602" y="128">List.copyOf(files)</text>
  <text class="ref"  x="602" y="144">:98  snapshot</text>

  <rect class="box" x="590" y="180" width="270" height="44" rx="6"/>
  <text class="code" x="602" y="198">SwingUtilities.invokeLater(…)</text>
  <text class="ref"  x="602" y="214">:100</text>

  <rect class="box" x="590" y="420" width="270" height="44" rx="6"/>
  <text class="code" x="602" y="438">searcher.execute(task)</text>
  <text class="ref"  x="602" y="454">:104  returns immediately</text>

  <!-- "Thinking…" posted to EDT -->
  <path class="postEdt" d="M860,202 L898,202" marker-end="url(#arrowEdt)"/>
  <rect class="edt" x="900" y="180" width="270" height="44" rx="6"/>
  <text class="code" x="912" y="198">status.setText("Thinking…")</text>
  <text class="ref"  x="912" y="214">:101-102  pending++</text>
  <text class="noteEdt" x="1182" y="206">on EDT</text>

  <!-- ============ SEARCHER THREAD ============ -->
  <rect class="lane" x="890" y="250" width="605" height="500" rx="12"/>
  <text class="headBg" x="905" y="272">live-photo-search thread  (searcher)</text>

  <path class="postBg" d="M860,442 L895,442" marker-end="url(#arrowBg)"/>

  <!-- task body trunk -->
  <path class="edge" d="M897,352 L897,712"/>
  <path class="edge" d="M897,352 L918,352" marker-end="url(#arrow)"/>
  <path class="edge" d="M897,632 L918,632" marker-end="url(#arrow)"/>
  <path class="edge" d="M897,712 L918,712" marker-end="url(#arrow)"/>

  <rect class="loop" x="905" y="292" width="580" height="380" rx="10"/>
  <text class="head" x="1473" y="312" text-anchor="end">for each file in snapshot</text>

  <rect class="bgT" x="920" y="330" width="250" height="44" rx="6"/>
  <text class="code" x="932" y="348">describe(file)</text>
  <text class="ref"  x="932" y="364">:107 → :121  returns text</text>

  <!-- describe's calls -->
  <path class="edge" d="M1170,352 L1190,352"/>
  <path class="edge" d="M1190,352 L1190,632"/>
  <path class="edge" d="M1190,352 L1208,352" marker-end="url(#arrow)"/>
  <path class="edge" d="M1190,412 L1208,412" marker-end="url(#arrow)"/>
  <path class="edge" d="M1190,492 L1208,492" marker-end="url(#arrow)"/>
  <path class="edge" d="M1190,572 L1208,572" marker-end="url(#arrow)"/>
  <path class="edge" d="M1190,632 L1208,632" marker-end="url(#arrow)"/>

  <rect class="bgT" x="1210" y="330" width="265" height="44" rx="6"/>
  <text class="code" x="1222" y="348">file.isDirectory()</text>
  <text class="ref"  x="1222" y="364">:122  false → "Not a folder…"</text>

  <rect class="bgT" x="1210" y="390" width="265" height="44" rx="6"/>
  <text class="code" x="1222" y="408">file.toPath()</text>
  <text class="ref"  x="1222" y="424">:125</text>

  <rect class="util" x="1210" y="450" width="265" height="84" rx="6"/>
  <text class="code" x="1222" y="470">LivePhotoUtils</text>
  <text class="code" x="1222" y="487">  .findLivePhotoVideos(folder)</text>
  <text class="ref"  x="1222" y="506">Files.list → forEach → join</text>
  <text class="ref"  x="1222" y="522">→ sort   (:127, Utils:33)</text>

  <rect class="bgT" x="1210" y="550" width="265" height="44" rx="6"/>
  <text class="code" x="1222" y="568">formatResults(folder, videos)</text>
  <text class="ref"  x="1222" y="584">:137  Processing… / names / Total</text>

  <rect class="errT" x="1210" y="610" width="265" height="44" rx="6"/>
  <text class="code" x="1222" y="628">catch → "Error reading…"</text>
  <text class="ref"  x="1222" y="644">:128  (Unchecked)IOException</text>

  <rect class="bgT" x="920" y="610" width="250" height="44" rx="6"/>
  <text class="code" x="932" y="628">invokeLater(append)</text>
  <text class="ref"  x="932" y="644">:108  one per file</text>

  <rect class="bgT" x="920" y="690" width="200" height="44" rx="6"/>
  <text class="code" x="932" y="708">invokeLater(reset)</text>
  <text class="ref"  x="932" y="724">:110-111  finally</text>

  <!-- ============ EDT LANE ============ -->
  <rect class="laneEdt" x="590" y="772" width="905" height="94" rx="12"/>
  <text class="headEdt" x="605" y="796">Swing event dispatch thread</text>

  <path class="postEdt" d="M1150,654 L1150,798" marker-end="url(#arrowEdt)"/>
  <path class="postEdt" d="M1000,734 L1000,798" marker-end="url(#arrowEdt)"/>

  <rect class="edt" x="780" y="800" width="250" height="44" rx="6"/>
  <text class="code" x="792" y="818">if (--pending == 0)</text>
  <text class="ref"  x="792" y="834">:112-113  status ← HINT</text>

  <rect class="edt" x="1060" y="800" width="250" height="44" rx="6"/>
  <text class="code" x="1072" y="818">output.append(text)</text>
  <text class="ref"  x="1072" y="834">:108</text>

  <!-- ============ LEGEND ============ -->
  <rect class="main" x="30" y="892" width="16" height="16" rx="3"/>
  <text class="note" x="54" y="905">caller's thread</text>
  <rect class="bgT" x="170" y="892" width="16" height="16" rx="3"/>
  <text class="note" x="194" y="905">live-photo-search thread</text>
  <rect class="edt" x="370" y="892" width="16" height="16" rx="3"/>
  <text class="note" x="394" y="905">Swing EDT</text>
  <rect class="errT" x="490" y="892" width="16" height="16" rx="3"/>
  <text class="note" x="514" y="905">error result</text>
  <rect class="dim" x="610" y="892" width="16" height="16" rx="3"/>
  <text class="note" x="634" y="905">called by importData first</text>
  <path class="edge" d="M820,900 L860,900" marker-end="url(#arrow)"/>
  <text class="note" x="868" y="905">direct call</text>
  <path class="postEdt" d="M960,900 L1000,900" marker-end="url(#arrowEdt)"/>
  <path class="postBg" d="M1010,900 L1050,900" marker-end="url(#arrowBg)"/>
  <text class="note" x="1058" y="905">posted to another thread (runs later)</text>
</svg>
